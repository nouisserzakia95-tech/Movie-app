<div class="container">
  @for (movie of movieService.movieList; track movie.id) {
    <div class="movie-card">
      <img
        [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
        [alt]="movie.title"
        loading="lazy"
      />
      <div class="movie-detail">
        <h3>{{ movie.title }}</h3>
      </div>
    </div>
  }
</div>

@if (loading()) {
  <p class="status">Chargement des films...</p>
} @else if (error()) {
  <p class="status error">{{ error() }}</p>
} @else {
  <div class="container">
    @for (movie of movieService.movieList(); track movie.id) {
      <div class="movie-card">
        @if (movie.poster_path) {
          <img [src]="imageBase + movie.poster_path" [alt]="movie.title" />
        } @else {
          <div class="no-poster">Pas d'affiche</div>
        }
        <div class="movie-detail">
          <h3>{{ movie.title }}</h3>
        </div>
      </div>
    }
  </div>
}

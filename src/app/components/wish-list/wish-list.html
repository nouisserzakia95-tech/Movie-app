<div class="page-header">
    <h2 class="page-title">My Wishlist</h2>
    <button class="back-btn" (click)="backToMovieList()">← Back to movie list</button>
</div>

@if (movieService.wishList().length === 0) {
    <p class="empty">Your wishlist is empty.</p>
} @else {
    <div class="container">
        @for (movie of movieService.wishList(); track movie.id) {
            <div class="movie-card" (click)="navigateTo(movie)">
                <img
                    [src]="`https://image.tmdb.org/t/p/original${movie.poster_path}`"
                    [alt]="movie.title"
                >
                <div class="movie-detail">
                    <h2>{{ movie.title }}</h2>
                    <button (click)="remove($event, movie)">Remove</button>
                </div>
            </div>
        }
    </div>
}
